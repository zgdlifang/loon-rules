# 拼多多隐藏「多多视频」入口 · 单订阅（一条 rewrite_remote 即可，无需单独订阅脚本）
# MITM 域名已在 hostname 声明；需在 MitM 开启并信任本地证书。
# 脚本在规则行内远程引用，不需要再去 script_remote 单独添加。

hostname = api.pinduoduo.com

# 首页底栏：剔除「多多视频」tab，保留 首页 / 消息 / 个人中心
^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\? url script-response-body https://cdn.jsdelivr.net/gh/zgdlifang/loon-rules@main/pdd-hide-video.js

# 首页集成渲染：删除底部视频区块与直播浮层
^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\? url script-response-body https://cdn.jsdelivr.net/gh/zgdlifang/loon-rules@main/pdd-hide-video.js
