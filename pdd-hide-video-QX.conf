# 拼多多隐藏「多多视频」入口 · Quantumult X rewrite 规则
# 依赖脚本：pdd-hide-video.js（请在 [script_remote] 订阅同一文件，脚本文件名需保持一致）
# MITM 域名已在下方 hostname 声明，无需手动改 [mitm]。

hostname = api.pinduoduo.com

# 首页底栏：过滤掉「多多视频」tab，只保留 首页 / 消息 / 个人中心
^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\? script-response-body pdd-hide-video.js

# 首页集成渲染：删除底部视频区块与直播浮层
^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\? script-response-body pdd-hide-video.js
